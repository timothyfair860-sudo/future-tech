<!DOCTYPE html>
<html>
<head>
    <title>FutureTech | Checkout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
        }

        nav {
            display: flex;
            justify-content: center;
            background: rgba(0,0,0,0.9);
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .box {
            background: #111;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .price {
            color: #00ffcc;
            font-size: 20px;
            margin: 10px 0;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 20px;
            background: white;
            color: black;
            cursor: pointer;
        }

        button:hover {
            background: #ccc;
        }
    </style>
</head>

<body>

<nav>
        <a href="index.html">Home</a>
    <a href="Items.html">Items</a>
	<a href="About.html">About Us</a>
    <a href="Repairs.html">Repairs</a>
    <a href="Contact.html">Contact</a>
</nav>

<div class="container">
    <div class="box">
        <h1 id="productName">Product</h1>
        <div class="price" id="productPrice">$0</div>

        <h3>Payment Method</h3>

        <select>
            <option>Credit Card</option>
            <option>Debit Card</option>
            <option>PayPal</option>
            <option>Cash on Delivery</option>
        </select>

        <input type="text" placeholder="Name on Card">

        <input type="text" placeholder="Card Number">

        <input type="text" placeholder="Expiry Date (MM/YY)">

        <input type="text" placeholder="CVV">

        <button onclick="confirmOrder()">Complete Purchase</button>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const product = params.get("product");
const price = params.get("price");

document.getElementById("productName").innerText = product;
document.getElementById("productPrice").innerText = "$" + price;

function confirmOrder() {
    alert("Order placed for " + product + "!");
}
</script>

</body>
</html>
